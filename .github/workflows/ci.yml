name: CI

# Runs on every PR, and on main after merge as a post-merge signal — main
# auto-deploys to both Vercel and Heroku, so a red main means production is
# about to be, or already is, broken.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 22.x matches what Vercel builds the frontend with, so a version-specific
      # failure shows up here rather than in a production build.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # Two packages, two installs: server/ is its own npm package with its own
      # lockfile and node_modules.
      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Redis and socket.io are mocked globally by server/tests/setup/mockInfra.js,
      # so this needs no service containers.
      - name: Client unit tests
        run: npm run test:client

      - name: Server tests
        run: npm test

      - name: Production build
        run: npm run build

  # The only automated coverage the frontend has. It was left out of CI at first
  # for being slow and racy, which meant anything under app/, components/ or
  # hooks/ merged on the strength of someone remembering to run it locally.
  #
  # A separate job on purpose: it is the flakiest thing here, and when it does
  # fail the lint/typecheck/test results should still be readable rather than
  # buried under a browser timeout.
  ui-smoke:
    name: browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # Same shape as a developer's machine: unauthenticated Redis on the default
    # port. The server reads HOST/REDIS_PORT/DB_PASS and falls back to exactly
    # this when they are unset, so nothing needs configuring here.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      # The runner image ships Chrome; scripts/ui-smoke/cdp.js finds it by path
      # and honours CHROME_PATH. Fail here with a clear message rather than
      # inside the test if that ever stops being true.
      - name: Check Chrome is present
        run: |
          which google-chrome || which chromium-browser || which chromium || {
            echo "No Chrome on the runner. Install one, or set CHROME_PATH."
            exit 1
          }
          google-chrome --version || true

      # Backgrounded so the run continues; logs go to files so a failure can be
      # read afterwards rather than vanishing with the process.
      - name: Start the backend
        run: npm run start-server > /tmp/server.log 2>&1 &

      - name: Start the frontend
        run: npm run dev > /tmp/client.log 2>&1 &

      # The smoke test exits immediately if either is unreachable, so wait for
      # both rather than racing them.
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health > /dev/null \
               && curl -sf http://localhost:3000 > /dev/null; then
              echo "stack up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "stack never came up"
          echo "--- server ---"; cat /tmp/server.log
          echo "--- client ---"; cat /tmp/client.log
          exit 1

      - name: Browser smoke test
        run: npm run test:ui

      # Whatever failed, the answer is usually in one of these.
      - name: Server and client logs
        if: failure()
        run: |
          echo "--- server ---"; cat /tmp/server.log || true
          echo "--- client ---"; cat /tmp/client.log || true

  # Proves the RELEASE works, not just the code: main auto-deploys, so by the
  # time this runs production is already serving whatever just merged.
  #
  # Only after both jobs pass, and never on a PR — it plays real games against
  # production, creating (short-lived, randomly named) rooms.
  verify-deploy:
    name: verify production
    runs-on: ubuntu-latest
    needs: [checks, ui-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # THE IMPORTANT STEP. This job starts the moment main moves, while Heroku
      # is still building, so without waiting it would test the release this one
      # REPLACED — and pass, reporting a deploy as verified that never happened.
      # /health reports the commit the running slug was built from
      # (scripts/write-version.js), so we wait for it to become ours.
      - name: Wait for the backend to be running this commit
        run: |
          BACKEND=https://nameless-coast-33840-33c3fd45fe2d.herokuapp.com
          for i in $(seq 1 60); do
            # `|| ""` keeps this a plain string: a bare `undefined` comes back
            # ANSI-coloured from node -pe and reads as garbage in the log.
            LIVE=$(curl -sf --max-time 10 "$BACKEND/health" \
              | node -pe 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); j.commit || ""' 2>/dev/null || echo "")
            if [ "$LIVE" = "${{ github.sha }}" ]; then
              echo "backend is running ${LIVE:0:9} after $((i * 10))s"
              exit 0
            fi
            SHORT=${LIVE:0:9}
            echo "waiting: live=${SHORT:-<none reported>} want=$(echo ${{ github.sha }} | cut -c1-9)"
            sleep 10
          done
          echo
          echo "The backend never reported this commit."
          echo "Either the Heroku deploy failed or did not finish within 10 minutes,"
          echo "or heroku-postbuild did not run scripts/write-version.js (a live"
          echo "commit of 'unknown' means the latter)."
          exit 1

      - name: Verify the deployed backend
        run: npm run verify:deploy
